<div class="cancelar-modal">

  <h2>¿Cancelar cita?</h2>

  <p class="mensaje">
    ¿Desea cancelar la cita de <strong>{{ data.mascota.name }}</strong>?
  </p>

  <p class="submensaje">
    Está acción no se puede deshacer
  </p>

  <p class="error" *ngIf="error">
    {{ error }}
  </p>

  <div class="acciones">

    <button class="btn-cancelar" (click)="close()">
      No, volver
    </button>

    <button class="btn-eliminar" (click)="cancelar()">
      Si, cancelar
    </button>

  </div>

</div>

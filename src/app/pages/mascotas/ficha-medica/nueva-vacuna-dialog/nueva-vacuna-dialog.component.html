<div class="vacuna-modal">
  <h2>Registrar vacuna</h2>
  <span class="mascota">{{ data.nombreMascota }}</span>
  <!-- Tipo -->
  <mat-form-field appearance="fill" class="campo">
    <mat-select [(ngModel)]="form.typeVacuna_FK" placeholder="Seleccione tipo de vacuna">
      <mat-option *ngFor="let t of tipos" [value]="t.idTypeVacuna" style="font-family: 'Nunito', sans-serif; font-size: 18px;">
        {{ t.type }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <!-- Fecha -->
  <mat-form-field appearance="fill" class="campo">
    <input
      matInput
      [matDatepicker]="picker"
      [(ngModel)]="form.date"
      [max]="maxDate"
      placeholder="Fecha"
      readonly>
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
  <!-- Peso y temperatura -->
  <div class="fila">
    <div class="dato">
      <label>Peso:</label>
      <input
        type="number"
        min="0"
        [(ngModel)]="form.weight"
        (keydown)="bloquearNegativo($event)">
      <span>kg</span>
    </div>
    <div class="dato">
      <label>Temp.:</label>
      <input
        type="number"
        min="0"
        [(ngModel)]="form.temperature"
        (keydown)="bloquearNegativo($event)">
      <span>°C</span>
    </div>
  </div>
  <p class="error" *ngIf="error">{{ error }}</p>
  <div class="acciones">
    <button class="btn-cancelar" (click)="close()">
      Cancelar
    </button>
    <button class="btn-guardar" (click)="save()">
      Guardar
    </button>
  </div>
</div>

<div class="reprogramar-modal">

  <h2>Reprogramar cita</h2>

  <p class="subtitulo">
    {{ data.tipo }} - {{ data.mascota.name }}
  </p>

  <!-- Fecha actual -->

  <mat-form-field appearance="fill" class="campo">

    <input
      matInput
      [value]="data.date | date:'dd/MM/yyyy'"
      placeholder="Fecha actual"
      readonly>

    <mat-datepicker-toggle
      matSuffix
      disabled>
    </mat-datepicker-toggle>

  </mat-form-field>

  <!-- Nueva fecha -->

  <mat-form-field appearance="fill" class="campo">

    <input
      matInput
      [matDatepicker]="picker"
      [(ngModel)]="nuevaFecha"
      [min]="minDate"
      placeholder="Fecha nueva"
      readonly>

    <mat-datepicker-toggle
      matSuffix
      [for]="picker">
    </mat-datepicker-toggle>

    <mat-datepicker #picker></mat-datepicker>

  </mat-form-field>

  <p class="error" *ngIf="error">
    {{ error }}
  </p>

  <div class="acciones">

    <button
      class="btn-cancelar"
      (click)="close()">
      Cancelar
    </button>

    <button
      class="btn-guardar"
      (click)="save()">
      Guardar
    </button>

  </div>

</div>

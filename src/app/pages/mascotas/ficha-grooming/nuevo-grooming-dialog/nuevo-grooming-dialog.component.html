<div class="grooming-modal">

  <h2>Grooming</h2>
  <p class="nombre">{{ data.mascotaNombre }}</p>

  <!-- Ingreso / Salida -->
  <div class="fila-horas">

    <div class="hora">
      <label>Ingreso:</label>

      <input
        type="time"
        [(ngModel)]="form.entry">
    </div>

    <div class="hora">
      <label>Salida:</label>

      <input
        type="time"
        [(ngModel)]="form.exit">
    </div>

  </div>

  <!-- Tipo de corte -->
  <mat-form-field appearance="fill" class="campo">
    <input
      matInput
      placeholder="Tipo de corte"
      [(ngModel)]="form.haircut">
  </mat-form-field>

  <!-- Fecha / Monto -->
  <div class="fila">

    <mat-form-field appearance="fill" class="campo mitad">
      <input
        matInput
        [matDatepicker]="picker"
        [(ngModel)]="form.date"
        [max]="maxDate"
        placeholder="Fecha"
        readonly>

      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo mitad">
      <input
        matInput
        type="number"
        min="0"
        placeholder="Monto total"
        [(ngModel)]="form.amount"
        (keydown)="bloquearCaracteres($event)">
    </mat-form-field>

  </div>

  <!-- A cuenta / Saldo -->
  <div class="fila">

    <mat-form-field appearance="fill" class="campo mitad">
      <input
        matInput
        type="number"
        min="0"
        placeholder="A cuenta"
        [(ngModel)]="form.onCredit"
        (keydown)="bloquearCaracteres($event)">
    </mat-form-field>

    <mat-form-field appearance="fill" class="campo mitad">
      <input
        matInput
        type="number"
        min="0"
        placeholder="Saldo"
        [(ngModel)]="form.residue"
        (keydown)="bloquearCaracteres($event)">
    </mat-form-field>

  </div>

  <p class="error" *ngIf="error">
    {{ error }}
  </p>

  <div class="acciones">

    <button class="btn-cancelar" (click)="close()">
      Cancelar
    </button>

    <button class="btn-guardar" (click)="save()">
      Guardar
    </button>

  </div>

</div>

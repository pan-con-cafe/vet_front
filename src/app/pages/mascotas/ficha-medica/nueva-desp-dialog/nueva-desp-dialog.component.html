<div class="desp-modal">
  <h2>Registrar desparacitación</h2>
  <span class="mascota">{{ data.nombreMascota }}</span>
  <!-- Producto -->
  <mat-form-field appearance="fill" class="campo">
    <input
      matInput
      [(ngModel)]="form.product"
      placeholder="Producto">
  </mat-form-field>
  <!-- Fecha -->
  <mat-form-field appearance="fill" class="campo campo-fecha">
    <input
      matInput
      [matDatepicker]="picker"
      [(ngModel)]="form.date"
      placeholder="Fecha"
      [max]="maxDate"
      readonly>
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
  <!-- Peso y dosis -->
  <div class="fila">
    <div class="dato">
      <label>Peso:</label>
      <input
        type="number"
        min="0"
        [(ngModel)]="form.weight"
        (keydown)="bloquearNegativo($event)">
      <span>kg</span>
    </div>
    <div class="dato">
      <label>Dosis:</label>
      <input
        type="number"
        min="0"
        [(ngModel)]="form.dose"
        (keydown)="bloquearNegativo($event)">
      <span>mg</span>
    </div>
  </div>
  <p class="error" *ngIf="error">{{ error }}</p>
  <div class="acciones">
    <button class="btn-cancelar" (click)="close()">
      Cancelar
    </button>
    <button class="btn-guardar" (click)="save()">
      Guardar
    </button>
  </div>
</div>
